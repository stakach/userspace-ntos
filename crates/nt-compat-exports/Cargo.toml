[package]
name = "nt-compat-exports"
description = "The minimal ntoskrnl.exe / hal.dll export table a loaded WDM driver links against: each export's compatibility status + trampoline binding, plus a fail-fast policy for unsupported exports. no_std + alloc."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
sha2 = "0.10"
nt-ahci = { path = "../nt-ahci" }
nt-fs = { path = "../nt-fs" }
nt-printf = { path = "../nt-printf" }
nt-io-manager = { path = "../nt-io-manager" }
nt-status = { path = "../nt-status" }
nt-types = { path = "../nt-types" }
nt-user-host = { path = "../nt-user-host" }
nt-memory-manager = { path = "../nt-memory-manager" }
nt-exe-image = { path = "../nt-exe-image" }
nt-pe-loader = { path = "../nt-pe-loader" }
nt-object-manager = { path = "../nt-object-manager" }
nt-kernel-abi = { path = "../nt-kernel-abi" }
nt-kernel-exec = { path = "../nt-kernel-exec" }
nt-process = { path = "../nt-process" }
nt-driver-runtime = { path = "../nt-driver-runtime" }
nt-hosted-runtime = { path = "../nt-hosted-runtime" }
syn = { version = "2", features = ["full", "visit"] }
