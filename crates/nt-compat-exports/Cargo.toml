[package]
name = "nt-compat-exports"
description = "The minimal ntoskrnl.exe / hal.dll export table a loaded WDM driver links against: each export's compatibility status + trampoline binding, plus a fail-fast policy for unsupported exports. no_std + alloc."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dev-dependencies]
nt-exe-image = { path = "../nt-exe-image" }
nt-pe-loader = { path = "../nt-pe-loader" }
nt-kernel-abi = { path = "../nt-kernel-abi" }
nt-kernel-exec = { path = "../nt-kernel-exec" }
nt-process = { path = "../nt-process" }
syn = { version = "2", features = ["full", "visit"] }
