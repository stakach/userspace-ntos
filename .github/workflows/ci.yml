name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crate-specs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  crate-specs:
    name: Crate specs (host)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      RUST_TEST_THREADS: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Public compile-time inputs; no proprietary Windows binaries or microkernel are needed.
      - name: Fetch pinned ReactOS source inputs
        uses: actions/checkout@v4
        with:
          repository: reactos/reactos
          ref: 6d8a5fa0bbec06559af469cfab8c70815c9e442d
          path: references/reactos
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /dll/win32/shell32/res/rgs/startmenu.rgs
            /dll/win32/browseui/res/rebarbandsite.rgs
            /dll/win32/comctl32/amd64_microsoft.windows.common-controls_6595b64144ccf1df_5.82.2600.2982_none_deadbeef.manifest
            /dll/win32/comctl32/amd64_microsoft.windows.common-controls_6595b64144ccf1df_6.0.2600.2982_none_deadbeef.manifest
            /win32ss/drivers/miniport/bochs/bochsmp.inf
      - name: Stage hive-generator INF input
        run: |
          mkdir -p rust-micro/.tmp/reactos/reactos/inf
          cp references/reactos/win32ss/drivers/miniport/bochs/bochsmp.inf rust-micro/.tmp/reactos/reactos/inf/bochsmp.inf
      - uses: dtolnay/rust-toolchain@stable
      - name: Workspace unit, integration and doc specs
        run: cargo test --workspace --locked 2>&1 | tee crate-specs.log
      - name: ntdll native-transport specs
        run: cargo test -p nt-ntdll --features native_transport --locked 2>&1 | tee native-transport-specs.log
      - name: Upload spec logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crate-spec-logs
          path: |
            crate-specs.log
            native-transport-specs.log
          if-no-files-found: warn
