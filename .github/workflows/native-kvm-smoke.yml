name: Native x86 KVM smoke

on:
  workflow_dispatch:
    inputs:
      boot_seconds:
        description: Bounded guest runtime in seconds
        type: choice
        default: '1200'
        options: ['90', '180', '300', '600', '1200', '1800', '3600']
      boot_runs:
        description: Sequential bounded boots on the same generated disk
        type: choice
        default: '1'
        options: ['1', '2']
      resume_run_id:
        description: Exact KVM workflow run whose published writable disk should continue (blank builds fresh)
        type: string
        default: ''
      resume_run_attempt:
        description: Exact source run attempt; required with resume_run_id
        type: string
        default: ''
      migrate_run_id:
        description: Prior KVM run whose published installed writable disk receives this commit's boot code
        type: string
        default: ''
      migrate_run_attempt:
        description: Source run attempt; required with migrate_run_id and exclusive with resume_run_id
        type: string
        default: ''
      interact:
        description: After the sealed Explorer desktop, drive scripts/kvm_interaction_steps.json through QMP input and prove the visible command result. Clearing this fails the gate
        type: boolean
        default: true
      interaction_profile:
        description: Select the desktop command proof or the FileBasic attribute before/after proof
        type: choice
        default: desktop
        options: [desktop, filebasic]
      multicore:
        description: Place worker threads on their affinity cores (the default); clear to build with NTOS_GUEST_WORKER_MULTICORE=0 and keep every guest thread on core 0
        type: boolean
        default: true
      executor_local_fs_probe:
        description: Build the preboot native FS-selection regression probe
        type: boolean
        default: false
      executor_passive_worker_probe:
        description: Bootstrap one proof-only passive executor before the desktop boot
        type: boolean
        default: false
      executor_fault_supervisor_probe:
        description: Prove the diagnostic fault terminal and a distinct supervised production worker
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: native-kvm-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-kvm-smoke:
    name: Build and boot pinned LiberNT image on KVM
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BOOT_SECONDS: ${{ inputs.boot_seconds }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - name: Validate disk continuation mode
        env:
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          RESUME_RUN_ATTEMPT: ${{ inputs.resume_run_attempt }}
          MIGRATE_RUN_ID: ${{ inputs.migrate_run_id }}
          MIGRATE_RUN_ATTEMPT: ${{ inputs.migrate_run_attempt }}
        run: |
          if [ -n "$RESUME_RUN_ID" ] && [ -n "$MIGRATE_RUN_ID" ]; then
            echo 'exact-head continuation and cross-commit migration are exclusive' >&2
            exit 1
          fi
          if { [ -n "$RESUME_RUN_ID" ] && [ -z "$RESUME_RUN_ATTEMPT" ]; } || \
             { [ -z "$RESUME_RUN_ID" ] && [ -n "$RESUME_RUN_ATTEMPT" ]; } || \
             { [ -n "$MIGRATE_RUN_ID" ] && [ -z "$MIGRATE_RUN_ATTEMPT" ]; } || \
             { [ -z "$MIGRATE_RUN_ID" ] && [ -n "$MIGRATE_RUN_ATTEMPT" ]; }; then
            echo 'disk run ID and attempt must be supplied together' >&2
            exit 1
          fi
      - name: Authenticate requested exact-head continuation run
        if: inputs.resume_run_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          RESUME_RUN_ATTEMPT: ${{ inputs.resume_run_attempt }}
        run: python3 scripts/ci_kvm_disk_continuation.py check-run --run-id "$RESUME_RUN_ID" --attempt "$RESUME_RUN_ATTEMPT"
      - name: Authenticate requested cross-commit migration run
        if: inputs.migrate_run_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIGRATE_RUN_ID: ${{ inputs.migrate_run_id }}
          MIGRATE_RUN_ATTEMPT: ${{ inputs.migrate_run_attempt }}
        run: python3 scripts/ci_kvm_disk_continuation.py check-migration-run --run-id "$MIGRATE_RUN_ID" --attempt "$MIGRATE_RUN_ATTEMPT"
      - name: Fetch pinned ReactOS source inputs
        uses: actions/checkout@v4
        with:
          repository: reactos/reactos
          ref: 6d8a5fa0bbec06559af469cfab8c70815c9e442d
          path: references/reactos
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /dll/win32/shell32/res/rgs/startmenu.rgs
            /dll/win32/browseui/res/rebarbandsite.rgs
            /dll/win32/comctl32/amd64_microsoft.windows.common-controls_6595b64144ccf1df_5.82.2600.2982_none_deadbeef.manifest
            /dll/win32/comctl32/amd64_microsoft.windows.common-controls_6595b64144ccf1df_6.0.2600.2982_none_deadbeef.manifest
            /win32ss/drivers/miniport/bochs/bochsmp.inf
      - name: Install native build and QEMU tools
        timeout-minutes: 30
        run: |
          sudo apt-get update
          # The headless QMP/PPM runner does not need QEMU's GUI and multimedia recommends.
          sudo apt-get install -y --no-install-recommends build-essential clang curl libarchive-tools ovmf qemu-system-x86 7zip mtools dosfstools tesseract-ocr tesseract-ocr-eng
          # Ubuntu's 7zip package exposes 7z; the project uses the equivalent 7zz CLI.
          if ! command -v 7zz >/dev/null && command -v 7z >/dev/null; then
            sudo ln -s "$(command -v 7z)" /usr/local/bin/7zz
          fi
          for tool in bsdtar 7zz qemu-system-x86_64 clang cc python3 mcopy mdir mmd mkfs.fat tesseract; do
            command -v "$tool"
          done
      - name: Install the current nightly for the native build
        run: |
          # The build scripts invoke +nightly and track the current nightly. The host
          # tools keep the runner's default stable toolchain.
          rustup toolchain install nightly --profile minimal --component rust-src --target x86_64-pc-windows-gnullvm
          rustc +nightly --version
      - name: Stage hive-generator INF input
        run: |
          mkdir -p rust-micro/.tmp/reactos/reactos/inf
          cp references/reactos/win32ss/drivers/miniport/bochs/bochsmp.inf rust-micro/.tmp/reactos/reactos/inf/bochsmp.inf
      - name: Verify hosted KVM access
        run: |
          python3 - <<'PY'
          import fcntl
          import os
          import platform
          import stat
          import subprocess

          if platform.machine() != "x86_64":
              raise SystemExit("hosted runner must be x86_64")
          path = "/dev/kvm"
          metadata = os.stat(path)
          if not stat.S_ISCHR(metadata.st_mode):
              raise SystemExit(f"{path} is not a character device")
          try:
              device = open(path, "rb+", buffering=0)
          except PermissionError:
              subprocess.run(["sudo", "-n", "chown", f"{os.getuid()}:{os.getgid()}", path], check=True)
              device = open(path, "rb+", buffering=0)
          with device:
              version = fcntl.ioctl(device, 0xAE00)
          if version != 12:
              raise SystemExit(f"unexpected KVM API version {version}")
          print("hosted KVM API version 12 available")
          flags = next((line.split(":", 1)[1].split() for line in open("/proc/cpuinfo")
                        if line.startswith("flags")), [])
          print("host TSC flags:", " ".join(
              flag for flag in ("constant_tsc", "nonstop_tsc", "tsc_reliable") if flag in flags
          ) or "none")
          PY
      - name: Verify bounded QEMU runner contracts
        run: python3 -m unittest discover -s scripts/tests -p 'test_ci_kvm_smoke_*.py' -v
      - name: Restore verified LiberNT archive cache
        id: libernt-archive-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: rust-micro/.tmp/libernt/*.zip
          key: libernt-amd64-archive-${{ hashFiles('rust-micro/vendor/libernt/manifest.txt') }}
      - name: Resolve native build cache identity
        id: native-cache-identity
        run: |
          printf 'prefix=native-kvm-build-v3-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'components/ntos-executive/triplet.json', 'rust-micro/Cargo.lock', 'rust-micro/rust-toolchain') }}\n' >> "$GITHUB_OUTPUT"
      - name: Restore native build cache
        id: native-build-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            components/ntos-executive/target
            crates/nt-ntdll-dll/target
            rust-micro/target
          key: ${{ steps.native-cache-identity.outputs.prefix }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.native-cache-identity.outputs.prefix }}-
            native-kvm-build-v2-${{ runner.os }}-
      - name: Build native image from verified pinned LiberNT release
        env:
          NTOS_GUEST_WORKER_MULTICORE: ${{ inputs.multicore && '1' || '0' }}
          NTOS_EXECUTOR_LOCAL_FS_PROBE: ${{ inputs.executor_local_fs_probe && '1' || '0' }}
          NTOS_EXECUTOR_PASSIVE_WORKER_PROBE: ${{ inputs.executor_passive_worker_probe && '1' || '0' }}
          NTOS_EXECUTOR_FAULT_SUPERVISOR_PROBE: ${{ inputs.executor_fault_supervisor_probe && '1' || '0' }}
        run: |
          set -o pipefail
          bash rust-micro/scripts/test_simpleboot_source.sh
          ./run.sh --build-only 2>&1 | tee native-kvm-build.log
          sha256sum rust-micro/.tmp/disk.img > native-kvm-image.sha256
          sha256sum rust-micro/.tmp/rootserver.elf > native-kvm-rootserver.sha256
          cp .tmp/nt-ntdll.dll native-kvm-ntdll.dll
          sha256sum native-kvm-ntdll.dll > native-kvm-ntdll.sha256
          cp rust-micro/vendor/libernt/manifest.txt native-kvm-libernt-manifest.txt
      - name: Save verified LiberNT archive cache
        if: steps.libernt-archive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: rust-micro/.tmp/libernt/*.zip
          key: libernt-amd64-archive-${{ hashFiles('rust-micro/vendor/libernt/manifest.txt') }}
      - name: Save native build cache
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            components/ntos-executive/target
            crates/nt-ntdll-dll/target
            rust-micro/target
          key: ${{ steps.native-cache-identity.outputs.prefix }}-${{ github.sha }}
      - name: Download stopped writable disk
        if: inputs.resume_run_id != '' || inputs.migrate_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: native-kvm-continuation-${{ inputs.resume_run_id || inputs.migrate_run_id }}-${{ inputs.resume_run_attempt || inputs.migrate_run_attempt }}
          path: native-kvm-continuation-in
          run-id: ${{ inputs.resume_run_id || inputs.migrate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and install exact writable disk
        id: resume-disk
        if: inputs.resume_run_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          RESUME_RUN_ATTEMPT: ${{ inputs.resume_run_attempt }}
        run: python3 scripts/ci_kvm_disk_continuation.py restore --run-id "$RESUME_RUN_ID" --attempt "$RESUME_RUN_ATTEMPT"
      - name: Verify and migrate installed writable disk
        id: migrate-disk
        if: inputs.migrate_run_id != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIGRATE_RUN_ID: ${{ inputs.migrate_run_id }}
          MIGRATE_RUN_ATTEMPT: ${{ inputs.migrate_run_attempt }}
        run: python3 scripts/ci_kvm_disk_continuation.py migrate --run-id "$MIGRATE_RUN_ID" --attempt "$MIGRATE_RUN_ATTEMPT"
      # The job passes exactly when every boot passes the desktop gate (scripts/ci_kvm_verdict.py):
      # a sealed Explorer desktop, every scripted interaction step with no input error, and no
      # executive panic, provider bugcheck, service-loop exit or kernel halt in the log.
      - name: Run bounded KVM boots against the desktop gate
        id: boot
        env:
          QEMU_ACCEL: kvm
          QEMU_DISPLAY: none
          GRAPHICS: '1'
          QEMU_MEMORY: 3072M
          QEMU_CPUS: '4'
          # QEMU leaves invariant TSC (CPUID 0x80000007 EDX[8]) out of `-cpu host` because
          # it blocks migration. Request it; QEMU drops it with a warning when KVM lacks it.
          QEMU_CPU_MODEL: host,invtsc=on
          INTERACT: ${{ inputs.interact && '1' || '' }}
          INTERACTION_PROFILE: ${{ inputs.interaction_profile || 'desktop' }}
          REQUIRE_PASSIVE_WORKER_PROBE: ${{ inputs.executor_passive_worker_probe && '1' || '' }}
          REQUIRE_FAULT_SUPERVISOR_PROBE: ${{ inputs.executor_fault_supervisor_probe && '1' || '' }}
        run: |
          set -euo pipefail
          probe_args=()
          if [ -n "$REQUIRE_PASSIVE_WORKER_PROBE" ]; then probe_args+=(--require-passive); fi
          if [ -n "$REQUIRE_FAULT_SUPERVISOR_PROBE" ]; then probe_args+=(--require-supervisor); fi
          interact_args=()
          if [ -n "$INTERACT" ]; then
            case "$INTERACTION_PROFILE" in
              desktop) interact_args=(--interact) ;;
              filebasic) interact_args=(--interact scripts/kvm_filebasic_interaction_steps.json) ;;
              *) echo "unknown interaction profile: $INTERACTION_PROFILE" >&2; exit 1 ;;
            esac
          fi
          boot_status=0
          rm -f native-kvm-qemu-stopped
          python3 scripts/ci_kvm_smoke.py --seconds "$BOOT_SECONDS" --trace-interrupts "${interact_args[@]}" || boot_status=$?
          if [ "${#probe_args[@]}" -ne 0 ] \
            && ! python3 scripts/ci_kvm_probe_markers.py native-kvm-smoke.log "${probe_args[@]}"; then
            boot_status=1
          fi
          if [ ! -f native-kvm-qemu-stopped ]; then echo 'QEMU cleanup unconfirmed; skipping disk hash' >&2; exit 1; fi
          sha256sum rust-micro/.tmp/disk.img > native-kvm-image-after-boot1.sha256
          if [ "${{ inputs.boot_runs || '1' }}" = '2' ]; then
            # Boot 2 reboots the same disk to prove the desktop persists. It also continues a
            # disk boot 1 marked worth continuing, but the job still fails with boot 1.
            if [ "$boot_status" -ne 0 ] && [ ! -s native-kvm-post-setup-idle.txt ] \
                && [ ! -s native-kvm-bound-reached.txt ]; then
              exit "$boot_status"
            fi
            boot1_status=$boot_status
            for path in native-kvm-smoke.log native-kvm-smoke.ppm native-kvm-qemu-int-tail.log native-kvm-guest-reset-state.json native-kvm-stall-state.json native-kvm-volume-dispatch-state.json native-kvm-cpu-samples.jsonl native-kvm-blockstats.jsonl native-kvm-stationary.txt native-kvm-post-setup-idle.txt native-kvm-verdict.json native-kvm-bound-reached.txt; do
              if [ -f "$path" ]; then
                cp "$path" "${path%.*}-boot1.${path##*.}"
              fi
            done
            # Boot 2 must earn its own desktop evidence.
            rm -f native-kvm-post-setup-idle.txt native-kvm-stationary.txt native-kvm-verdict.json native-kvm-bound-reached.txt
            # The second boot clears interaction evidence, so keep the first boot's apart.
            mkdir -p native-kvm-interact-boot1
            for path in native-kvm-interact.jsonl native-kvm-interact-*.ppm; do
              if [ -f "$path" ]; then mv "$path" native-kvm-interact-boot1/; fi
            done
            # The probe has stopped and reaped QEMU; no image rebuild occurs between boots.
            boot_status=0
            boot2_args=()
            if [ "$boot1_status" -eq 0 ] && [ "$INTERACTION_PROFILE" = filebasic ]; then
              # Boot 1 proved the directory and file on this exact disk. Boot 2 must observe
              # their persistence, then verify the real listing and attribute receipts again.
              boot2_args=(--expect-persisted-basicproof)
            fi
            rm -f native-kvm-qemu-stopped
            python3 scripts/ci_kvm_smoke.py --seconds "$BOOT_SECONDS" --trace-interrupts "${boot2_args[@]}" "${interact_args[@]}" || boot_status=$?
            if [ "${#probe_args[@]}" -ne 0 ] \
              && ! python3 scripts/ci_kvm_probe_markers.py native-kvm-smoke.log "${probe_args[@]}"; then
              boot_status=1
            fi
            if [ ! -f native-kvm-qemu-stopped ]; then echo 'QEMU cleanup unconfirmed; skipping disk hash' >&2; exit 1; fi
            sha256sum rust-micro/.tmp/disk.img > native-kvm-image-after-boot2.sha256
            if [ "$boot_status" -ne 0 ]; then exit "$boot_status"; fi
            if [ "$boot1_status" -ne 0 ]; then echo 'boot 1 failed the desktop gate' >&2; exit "$boot1_status"; fi
          elif [ "$boot_status" -ne 0 ]; then
            exit "$boot_status"
          fi
      - name: Correlate bounded installer child phases
        if: always()
        run: |
          for suffix in '' '-boot1'; do
            serial="native-kvm-smoke${suffix}.log"
            if [ -f "$serial" ]; then
              python3 scripts/ci_kvm_installer_phase.py "$serial" --installer-only \
                > "native-kvm-installer-phase${suffix}.json"
            fi
          done
      # A disk is published from a boot that passed the desktop gate, or from a failed boot the
      # runner marked as worth continuing: it went idle after setup completed and a user logged
      # on, or it ran its whole bound without a fault. The manifest records
      # which kind of stop produced the disk and later runs check it against this conclusion.
      - name: Prepare full stopped writable disk for an exact later run
        id: publish-disk
        if: >-
          always() && (steps.boot.outcome == 'success' ||
          (steps.boot.outcome == 'failure' &&
          (hashFiles('native-kvm-post-setup-idle.txt') != '' ||
          hashFiles('native-kvm-bound-reached.txt') != '')))
        run: |
          python3 scripts/ci_kvm_disk_continuation.py publish \
            --boot-runs "${{ inputs.boot_runs || '1' }}" \
            --boot-seconds "$BOOT_SECONDS" \
            --stop "${{ steps.boot.outcome == 'success' && 'desktop' || (hashFiles('native-kvm-post-setup-idle.txt') != '' && 'post-setup-idle' || 'bound-reached') }}"
      - name: Upload full writable disk continuation
        if: always() && steps.publish-disk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: native-kvm-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-kvm-continuation-out/
          compression-level: 1
          retention-days: 7
          if-no-files-found: error
      - name: Roll back the generated disk after a failed continuation or migration
        if: failure() && steps.publish-disk.outcome != 'success' && (steps.resume-disk.outcome == 'success' || steps.migrate-disk.outcome == 'success')
        run: python3 scripts/ci_kvm_disk_continuation.py rollback
      - name: Upload native build and startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-kvm-smoke-evidence
          include-hidden-files: true
          path: |
            native-kvm-build.log
            native-kvm-smoke.log
            native-kvm-smoke.ppm
            native-kvm-installer-phase.json
            native-kvm-smoke-boot1.log
            native-kvm-smoke-boot1.ppm
            native-kvm-installer-phase-boot1.json
            native-kvm-qemu-int-tail.log
            native-kvm-qemu-int-tail-boot1.log
            native-kvm-guest-reset-state.json
            native-kvm-guest-reset-state-boot1.json
            native-kvm-stall-state.json
            native-kvm-stall-state-boot1.json
            native-kvm-volume-dispatch-state.json
            native-kvm-volume-dispatch-state-boot1.json
            native-kvm-cpu-samples.jsonl
            native-kvm-cpu-samples-boot1.jsonl
            native-kvm-blockstats.jsonl
            native-kvm-blockstats-boot1.jsonl
            native-kvm-stationary.txt
            native-kvm-stationary-boot1.txt
            native-kvm-post-setup-idle.txt
            native-kvm-post-setup-idle-boot1.txt
            native-kvm-verdict.json
            native-kvm-verdict-boot1.json
            native-kvm-bound-reached.txt
            native-kvm-bound-reached-boot1.txt
            native-kvm-interact.jsonl
            native-kvm-interact-*.ppm
            native-kvm-interact-boot1/
            native-kvm-image.sha256
            native-kvm-image-after-boot1.sha256
            native-kvm-image-after-boot2.sha256
            native-kvm-rootserver.sha256
            native-kvm-ntdll.sha256
            native-kvm-ntdll.dll
            native-kvm-qemu-stopped
            native-kvm-libernt-manifest.txt
            native-kvm-continuation-out/manifest.json
            native-kvm-continuation-receipt.json
            native-kvm-continuation-rolled-back
            rust-micro/target/mykernel-x86/release/mykernel-rust
            rust-micro/.tmp/rootserver.elf
          if-no-files-found: warn
